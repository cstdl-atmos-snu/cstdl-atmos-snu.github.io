# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Convective Systems/Tropical Dynamics Lab"
title: "School of Earth and Environmental Sciences"
institution: "Seoul National University"
email: daehyun@snu.ac.kr
photo: headshot.jpg  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://tinyurl.com/daehyunkim-publications"
  github: "https://github.com/cstdl-atmos-snu"
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#0f6f8f"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "Convective Systems/Tropical Dynamics Lab (Daehyun Kim), Seoul National University: tropical convection, the MJO, equatorial waves, and tropical cyclones"
baseurl: "https://cstdl-atmos-snu.github.io"
url: "https://cstdl-atmos-snu.github.io"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: research
  - name: publications
  - name: team
  - name: about
  # - name: talks
  # - name: software
  # - name: teaching
  # - name: blogs

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Kim
  first_name: [Daehyun, D.]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
