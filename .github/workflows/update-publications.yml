name: Update publications from sheet

on:
  schedule:
    - cron: "0 18 * * *"   # every day at 03:00 KST
  workflow_dispatch:         # "Run workflow" button for an immediate update

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build publications.html
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python scripts/build_publications.py
      - name: Commit if changed
        run: |
          git config user.name "publications-bot"
          git config user.email "actions@users.noreply.github.com"
          git add publications.html
          git diff --cached --quiet || git commit -m "Update publications from sheet"
          git push
